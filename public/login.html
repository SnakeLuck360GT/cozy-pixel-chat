<!doctype html>
<html lang="en" data-theme="farmhouse">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6d79c">
<link rel="icon" href="/favicon.ico" sizes="16x16">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-icon.png">
<link rel="preload" href="/vendor/pixelify-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/vendor/silkscreen-latin.woff2" as="font" type="font/woff2" crossorigin>
<script src="/js/boot.js"></script>
<link rel="stylesheet" href="/style.css">
<title>Log in · chat</title>
<script type="module" src="/js/login.js"></script>
</head>
<body>
<main class="page">
  <div class="auth-box">
    <div class="window">
      <header class="window-title"><h2>chat</h2></header>
      <div class="window-body">
        <div class="auth-art" id="art"></div>
        <form id="login">
          <label class="field"><span>Username</span><input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
          <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label>
          <p class="status error" id="status" role="alert"></p>
          <button class="btn block" type="submit">Log in</button>
        </form>
      </div>
    </div>
    <p class="auth-foot">Got an invite code? <a href="/signup">Sign up</a> · <a href="/terms">Terms</a></p>
  </div>
</main>
</body>
</html>
