# docker compose up -d
#
# Works as-is on http://localhost (files on http://127.0.0.1). For a real
# server, copy .env.example to .env and fill in your two domains.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      CONTENT_URL: ${CONTENT_URL:-http://127.0.0.1}
      # Leave empty and one gets made and saved in the data volume.
      SIGNING_SECRET: ${SIGNING_SECRET:-}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      MAX_SIZE_MB: ${MAX_SIZE_MB:-100}
    volumes:
      - chat-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      CONTENT_URL: ${CONTENT_URL:-http://127.0.0.1}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/public:ro
      - caddy-data:/data
      - caddy-config:/config

  # The call relay, for when two people can't connect directly (mobile data,
  # strict wifi). Off by default: docker compose --profile calls up -d
  # Needs UDP 3478, TCP 3478 and UDP 49160-49200 open on the server and in
  # your cloud provider's firewall. Host networking because Docker is slow at
  # mapping big port ranges, and coturn wants to see the real addresses.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    profiles: ["calls"]
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=${TURN_REALM:-chat}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --external-ip=$$(detect-external-ip)
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --user-quota=12
      - --total-quota=60
      - --stale-nonce=600
      - --log-file=stdout
      # Never relay into the server itself or private networks behind it.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  chat-data:
  caddy-data:
  caddy-config:
